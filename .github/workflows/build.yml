name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            os_label: linux
            arch_label: x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            os_label: linux
            arch_label: arm64
            ext: ""
          # macOS — macos-13 is the last x86_64 runner; macos-latest is Apple Silicon.
          - os: macos-13
            os_label: macos
            arch_label: x86_64
            ext: ""
          - os: macos-latest
            os_label: macos
            arch_label: arm64
            ext: ""
          # Windows
          - os: windows-latest
            os_label: windows
            arch_label: x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file binary
        run: pyinstaller --onefile --name mouse-jiggler mouse_jiggler.py

      - name: Stage release-named binary
        shell: bash
        run: |
          set -e
          mkdir -p staging
          cp "dist/mouse-jiggler${{ matrix.ext }}" \
             "staging/mouse-jiggler-${{ matrix.os_label }}-${{ matrix.arch_label }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mouse-jiggler-${{ matrix.os_label }}-${{ matrix.arch_label }}
          path: staging/*

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum release files
        run: |
          set -e
          mkdir -p out
          # Flatten matrix artifacts into out/.
          find artifacts -type f -exec cp {} out/ \;
          chmod +x out/mouse-jiggler-linux-* out/mouse-jiggler-macos-* 2>/dev/null || true
          # Backwards-compatible aliases for the old asset names so existing
          # README/scripts pointing at them keep working.
          cp out/mouse-jiggler-macos-arm64        out/mouse-jiggler-macos
          cp out/mouse-jiggler-windows-x86_64.exe out/mouse-jiggler-windows.exe
          chmod +x out/mouse-jiggler-macos
          (cd out && sha256sum * > SHA256SUMS)
          ls -la out

      - name: Compute release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}"  >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Build ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          files: |
            out/mouse-jiggler-linux-x86_64
            out/mouse-jiggler-linux-arm64
            out/mouse-jiggler-macos-x86_64
            out/mouse-jiggler-macos-arm64
            out/mouse-jiggler-macos
            out/mouse-jiggler-windows-x86_64.exe
            out/mouse-jiggler-windows.exe
            out/SHA256SUMS
