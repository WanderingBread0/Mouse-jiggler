name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mouse-jiggler-linux
            binary: mouse-jiggler
          - os: macos-latest
            artifact: mouse-jiggler-macos
            binary: mouse-jiggler
          - os: windows-latest
            artifact: mouse-jiggler-windows
            binary: mouse-jiggler.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file binary
        run: pyinstaller --onefile --name mouse-jiggler mouse_jiggler.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename per-OS binaries
        run: |
          set -e
          mkdir -p out
          mv artifacts/mouse-jiggler-linux/mouse-jiggler       out/mouse-jiggler-linux-x86_64
          mv artifacts/mouse-jiggler-macos/mouse-jiggler       out/mouse-jiggler-macos
          mv artifacts/mouse-jiggler-windows/mouse-jiggler.exe out/mouse-jiggler-windows.exe
          chmod +x out/mouse-jiggler-linux-x86_64 out/mouse-jiggler-macos

      - name: Compute release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Build ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          files: |
            out/mouse-jiggler-linux-x86_64
            out/mouse-jiggler-macos
            out/mouse-jiggler-windows.exe
